apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deepskyn-backend-hpa
  namespace: deepskyn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deepskyn-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # Scale up when CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80      # Scale up when memory > 80%
