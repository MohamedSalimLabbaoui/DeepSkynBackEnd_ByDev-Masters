apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepskyn-backend-ingress
  namespace: deepskyn
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Uncomment if you have cert-manager for TLS:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # Uncomment tls section when cert-manager is configured:
  # tls:
  #   - hosts:
  #       - api.deepskyn.com
  #     secretName: deepskyn-tls
  rules:
    - host: api.deepskyn.com       # ← replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepskyn-backend-service
                port:
                  number: 80
