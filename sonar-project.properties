sonar.projectKey=backend
sonar.projectName=NestJS Backend
sonar.projectVersion=1.0

# ── Sources ───────────────────────────────────────────────
sonar.sources=src
sonar.tests=src

# Only these are treated as test files
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.e2e-spec.ts

# Exclude only what's truly not your code
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  **/*.js,\
  src/**/*.spec.ts,\
  src/**/*.e2e-spec.ts

# ── TypeScript ────────────────────────────────────────────
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Point Sonar to your tsconfig explicitly
sonar.typescript.tsconfigPath=tsconfig.json

# ── Server ────────────────────────────────────────────────
sonar.host.url=http://localhost:9000

# ── Encoding ──────────────────────────────────────────────
sonar.sourceEncoding=UTF-8