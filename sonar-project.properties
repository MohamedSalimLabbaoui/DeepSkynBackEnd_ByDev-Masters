# ============================================================
# SonarQube — DeepSkyn Backend
# ============================================================

sonar.projectKey=deepskyn-backend
sonar.projectName=DeepSkyn Backend
sonar.projectVersion=1.0

# Source directories
sonar.sources=src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.e2e-spec.ts,\
  **/prisma/**,\
  **/scraped-data/**,\
  src/test-churn.ts

# Test directories
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# TypeScript support
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage report (generated by jest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate — block CI if fails
sonar.qualitygate.wait=true

# Branch analysis (Community Edition does not support branch analysis,
# remove the line below if using Community Edition)
sonar.branch.name=${env.GITHUB_HEAD_REF}
