# ============================================================
# DeepSkyn — Local Monitoring Stack
# docker-compose up -d → starts Prometheus + Grafana + exporters
# ============================================================
#
# Usage:
#   docker-compose -f docker-compose.monitoring.yml up -d
#   Grafana  → http://localhost:3001  (admin / admin)
#   Prometheus → http://localhost:9090
#
# ⚠️  This file is for LOCAL monitoring only.
#     Do NOT use in production — use the k8s/ manifests instead.
# ============================================================

version: "3.9"

networks:
  monitoring:
    driver: bridge
  app:
    external: true           # shares network with docker-compose.yml (backend + keycloak)
    name: deepskyn_app

services:

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: deepskyn-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: deepskyn-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3001"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3001"
    networks:
      - monitoring
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node Exporter (host metrics) ───────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: deepskyn-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ── PostgreSQL Exporter ────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: deepskyn-postgres-exporter
    restart: unless-stopped
    environment:
      # Uses the same credentials as the backend .env
      DATA_SOURCE_NAME: "postgresql://postgres:1234@postgres:5432/deepskyn?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - app
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
