name: 🔬 CI — Test, Lint & SonarQube

on:
  push:
    branches:
      - azizsaid
  pull_request:
    branches:
      - azizsaid

env:
  NODE_VERSION: '20'

jobs:
  # ════════════════════════════════════════════════
  # JOB 1 — Lint & Format check
  # ════════════════════════════════════════════════
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run lint -- --max-warnings=0

  # ════════════════════════════════════════════════
  # JOB 2 — Unit Tests with Coverage
  # ════════════════════════════════════════════════
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    # ── Services needed by the app & tests ──
    services:
      # PostgreSQL — same credentials as .env (CI uses GitHub Secrets)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres_ci' }}
          POSTGRES_DB: deepskyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Keycloak (standalone image, runs in-container)
      keycloak:
        image: quay.io/keycloak/keycloak:24.0
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KC_HTTP_PORT: 8181
          KC_HEALTH_ENABLED: 'true'
        ports:
          - 8181:8181
        # Start in dev mode (no TLS, in-memory H2 DB)
        options: >-
          --health-cmd "curl -f http://localhost:8181/health/ready || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Native modules (canvas, sharp) need build tools
      - name: 🔧 Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libpng-dev

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma client
        run: npx prisma generate

      - name: 🗄️ Run DB migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USERNAME || 'postgres' }}:${{ secrets.DB_PASSWORD || 'postgres_ci' }}@localhost:5432/deepskyn_test?schema=public

      - name: 🧪 Run unit tests with coverage
        run: npm run test:cov -- --ci --forceExit --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://${{ secrets.DB_USERNAME || 'postgres' }}:${{ secrets.DB_PASSWORD || 'postgres_ci' }}@localhost:5432/deepskyn_test?schema=public
          # Keycloak (used by mocks — no real Keycloak calls in unit tests)
          KEYCLOAK_AUTH_SERVER_URL: http://localhost:8181
          KEYCLOAK_REALM: master
          KEYCLOAK_RESOURCE: app
          KEYCLOAK_SECRET: test-secret
          KEYCLOAK_ADMIN_USER: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          # Python LSF service — mocked in unit tests
          SIGN_TRANSLATION_SERVICE_URL: http://localhost:8000
          # App
          PORT: 3000
          JWT_SECRET: ci-test-jwt-secret
          JWT_EXPIRATION: 1d
          FRONTEND_URL: http://localhost:5173
          # AI keys (mocked in unit tests, not used)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'ci-dummy' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-dummy' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-dummy' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || 'ci-dummy' }}
          SUPABASE_BUCKET: deepskyn-images
          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_dummy' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_dummy' }}
          STRIPE_PRICE_ID_PREMIUM_MONTHLY: price_dummy
          STRIPE_PRICE_ID_PREMIUM_YEARLY: price_dummy
          # Mail
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: 587
          MAIL_USER: ci@deepskyn.com
          MAIL_PASSWORD: dummy
          MAIL_FROM: '"DeepSkyn CI" <ci@deepskyn.com>'

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ════════════════════════════════════════════════
  # JOB 3 — SonarQube Analysis
  # ════════════════════════════════════════════════
  sonarqube:
    name: 🔍 SonarQube Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: ⬇️ Checkout code (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: 🔍 Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ════════════════════════════════════════════════
  # JOB 4 — Build & Push Docker image
  # ════════════════════════════════════════════════
  docker-build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/deepskyn-backend
          tags: |
            type=sha,prefix=azizsaid-,format=short
            type=raw,value=latest,enable=true

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
