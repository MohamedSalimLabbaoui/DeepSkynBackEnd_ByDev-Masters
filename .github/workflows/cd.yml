name: 🚀 CD — Deploy to Render

on:
  # Only runs AFTER CI passes on azizsaid branch
  workflow_run:
    workflows: ["🔬 CI — Test, Lint & SonarQube"]
    types:
      - completed
    branches:
      - azizsaid

jobs:
  # ════════════════════════════════════════════════
  # Guard — only deploy if CI was successful
  # ════════════════════════════════════════════════
  check-ci:
    name: ✅ Verify CI Passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI succeeded, starting deployment..."

  # ════════════════════════════════════════════════
  # JOB 1 — Deploy NestJS Backend to Render
  # ════════════════════════════════════════════════
  deploy-backend:
    name: 🚀 Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: check-ci

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Trigger Render deploy hook (Web Service)
      - name: 🚀 Trigger Render Deploy
        run: |
          echo "Deploying to Render..."
          curl -s -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            | tee /tmp/render-response.json

          # Fail if the response is not 200-ish
          STATUS=$(cat /tmp/render-response.json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('id','ERROR'))")
          if [ "$STATUS" = "ERROR" ]; then
            echo "❌ Render deploy hook returned an error"
            cat /tmp/render-response.json
            exit 1
          fi
          echo "✅ Render deploy triggered — deploy ID: $STATUS"

      # Poll Render API until deploy finishes (max 10 min)
      - name: ⏳ Wait for Render deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Polling Render for deploy status..."
          TIMEOUT=600
          INTERVAL=20
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | python3 -c "import sys, json; deploys=json.load(sys.stdin); print(deploys[0]['deploy']['status'] if deploys else 'unknown')")
            echo "  [$ELAPSED s] Status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅ Deploy is LIVE!"
              exit 0
            elif [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "❌ Deploy FAILED with status: $STATUS"
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "⚠️ Timeout reached, deploy may still be in progress"
          exit 1

      - name: 🏥 Health check — Backend
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          echo "Running health check on $RENDER_BACKEND_URL/api ..."
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_BACKEND_URL/api")
            echo "  Attempt $i — HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

  # ════════════════════════════════════════════════
  # JOB 2 — Run Prisma Migrations after deploy
  # ════════════════════════════════════════════════
  run-migrations:
    name: 🗄️ Run DB Migrations
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma client
        run: npx prisma generate

      - name: 🗄️ Deploy migrations to production DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  # ════════════════════════════════════════════════
  # JOB 3 — Notify on Slack / Discord (optional)
  # ════════════════════════════════════════════════
  notify:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-backend, run-migrations]
    if: always()

    steps:
      - name: ✅ Notify success
        if: ${{ needs.deploy-backend.result == 'success' && needs.run-migrations.result == 'success' }}
        run: |
          echo "🚀 DeepSkyn Backend deployed successfully!"
          echo "Branch: azizsaid"
          echo "Commit: ${{ github.sha }}"
          # Uncomment to post to Slack:
          # curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text":"✅ DeepSkyn Backend deployed successfully! Branch: azizsaid, Commit: ${{ github.sha }}"}'

      - name: ❌ Notify failure
        if: ${{ needs.deploy-backend.result == 'failure' || needs.run-migrations.result == 'failure' }}
        run: |
          echo "❌ DeepSkyn Backend deployment FAILED!"
          echo "Branch: azizsaid"
          echo "Commit: ${{ github.sha }}"
          exit 1
